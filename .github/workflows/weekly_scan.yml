name: Weekly AMR Literature Scan

on:
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      end_date:
        description: 'End date (YYYY-MM-DD, defaults to today)'
        required: false
      days:
        description: 'Lookback days (default: 7)'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run literature scan
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.end_date }}" ]; then
            ARGS="$ARGS --end-date ${{ inputs.end_date }}"
          fi
          if [ -n "${{ inputs.days }}" ]; then
            ARGS="$ARGS --days ${{ inputs.days }}"
          fi
          python main.py $ARGS

      - name: Commit and push weekly results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add literature scan for $(date -u +%Y-%m-%d)"
            git push origin main
          fi
